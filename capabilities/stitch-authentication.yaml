naftiko: 1.0.0-alpha2
info:
  label: Stitch API — Authentication
  description: 'Stitch API — Authentication. 1 operations. Lead operation: Get Access Token. Self-contained Naftiko capability
    covering one Stitch business surface.'
  tags:
  - Stitch
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STITCH_API_KEY: STITCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: stitch-authentication
    baseUri: https://api.stitch.money
    description: Stitch API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: connect-token
      path: /connect/token
      operations:
      - name: getaccesstoken
        method: POST
        description: Get Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.STITCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: stitch-authentication-rest
    port: 8080
    description: REST adapter for Stitch API — Authentication. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/connect/token
      name: connect-token
      description: REST surface for connect-token.
      operations:
      - method: POST
        name: getaccesstoken
        description: Get Access Token
        call: stitch-authentication.getaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: stitch-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Stitch API — Authentication. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-access-token
      description: Get Access Token
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: stitch-authentication.getaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
