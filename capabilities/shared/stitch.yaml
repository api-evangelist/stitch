naftiko: "1.0.0-alpha1"

info:
  label: Stitch GraphQL API
  description: >-
    Stitch open banking and payments GraphQL API providing payment initiation,
    bank account data access, and disbursements across South Africa and Nigeria.
    Authentication via OAuth 2.0 client credentials Bearer token.
  tags:
    - Africa
    - Open Banking
    - Payments
    - Financial Data
    - South Africa
    - Nigeria
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      STITCH_CLIENT_ID: STITCH_CLIENT_ID
      STITCH_CLIENT_SECRET: STITCH_CLIENT_SECRET
      STITCH_ACCESS_TOKEN: STITCH_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: stitch
      baseUri: https://api.stitch.money
      description: Stitch GraphQL API for payments and financial data.
      authentication:
        type: bearer
        token: "{{STITCH_ACCESS_TOKEN}}"
      resources:
        - name: graphql
          path: /graphql
          description: Stitch GraphQL endpoint for all operations.
          operations:
            - name: initiate-payment
              method: POST
              description: Initiate a Pay By Bank payment request.
              body:
                type: json
                data:
                  query: "mutation InitiatePayment($input: PaymentInitiationRequestInput!) { clientPaymentInitiationRequestCreate(input: $input) { paymentInitiationRequest { id url status } } }"
                  variables:
                    input:
                      amount:
                        quantity: "{{tools.amount}}"
                        currency: "{{tools.currency}}"
                      payerReference: "{{tools.payerReference}}"
                      beneficiaryReference: "{{tools.beneficiaryReference}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.data.clientPaymentInitiationRequestCreate"

            - name: get-payment-status
              method: POST
              description: Get the current status of a payment initiation request.
              body:
                type: json
                data:
                  query: "query GetPaymentStatus($paymentRequestId: ID!) { node(id: $paymentRequestId) { ... on PaymentInitiationRequest { id status amount { quantity currency } } } }"
                  variables:
                    paymentRequestId: "{{tools.paymentRequestId}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.data.node"

            - name: list-bank-accounts
              method: POST
              description: List bank accounts linked by the user.
              body:
                type: json
                data:
                  query: "query ListBankAccounts { user { bankAccounts { id name accountNumber bankId availableBalance { quantity currency } currentBalance { quantity currency } } } }"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.data.user.bankAccounts"

            - name: get-account-transactions
              method: POST
              description: Retrieve transactions for a linked bank account.
              body:
                type: json
                data:
                  query: "query GetTransactions($accountId: ID!, $first: Int, $after: String) { node(id: $accountId) { ... on BankAccount { transactions(first: $first, after: $after) { edges { node { id amount { quantity currency } date description reference } } pageInfo { hasNextPage endCursor } } } } }"
                  variables:
                    accountId: "{{tools.accountId}}"
                    first: "{{tools.first}}"
                    after: "{{tools.after}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.data.node.transactions"

            - name: create-disbursement
              method: POST
              description: Create an outbound payment disbursement.
              body:
                type: json
                data:
                  query: "mutation CreateDisbursement($input: DisbursementCreateInput!) { disbursementCreate(input: $input) { disbursement { id status amount { quantity currency } } } }"
                  variables:
                    input:
                      amount:
                        quantity: "{{tools.amount}}"
                        currency: "{{tools.currency}}"
                      beneficiaryAccountNumber: "{{tools.beneficiaryAccountNumber}}"
                      beneficiaryBankId: "{{tools.beneficiaryBankId}}"
                      reference: "{{tools.reference}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.data.disbursementCreate"

  exposes:
    - type: rest
      port: 8100
      namespace: stitch-rest
      resources:
        - path: /v1/payments
          name: payments
          description: Payment initiation.
          operations:
            - method: POST
              name: initiate-payment
              description: Initiate a Pay By Bank payment.
              call: "stitch.initiate-payment"
              with:
                amount: "rest.amount"
                currency: "rest.currency"
                payerReference: "rest.payerReference"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/bank-accounts
          name: bank-accounts
          description: Linked bank accounts.
          operations:
            - method: GET
              name: list-bank-accounts
              description: List user-linked bank accounts.
              call: "stitch.list-bank-accounts"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/disbursements
          name: disbursements
          description: Outbound payment disbursements.
          operations:
            - method: POST
              name: create-disbursement
              description: Create an outbound payment disbursement.
              call: "stitch.create-disbursement"
              with:
                amount: "rest.amount"
                currency: "rest.currency"
                beneficiaryAccountNumber: "rest.beneficiaryAccountNumber"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: stitch-mcp
      transport: http
      tools:
        - name: initiate-payment
          description: Initiate a Pay By Bank payment request.
          hints:
            readOnly: false
          call: "stitch.initiate-payment"
          with:
            amount: "tools.amount"
            currency: "tools.currency"
            payerReference: "tools.payerReference"
            beneficiaryReference: "tools.beneficiaryReference"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-payment-status
          description: Get the current status of a payment request.
          hints:
            readOnly: true
            idempotent: true
          call: "stitch.get-payment-status"
          with:
            paymentRequestId: "tools.paymentRequestId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-bank-accounts
          description: List bank accounts linked by the user.
          hints:
            readOnly: true
            idempotent: true
          call: "stitch.list-bank-accounts"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-account-transactions
          description: Retrieve transactions for a linked bank account.
          hints:
            readOnly: true
            idempotent: true
          call: "stitch.get-account-transactions"
          with:
            accountId: "tools.accountId"
            first: "tools.first"
            after: "tools.after"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-disbursement
          description: Create an outbound payment disbursement to a bank account.
          hints:
            readOnly: false
          call: "stitch.create-disbursement"
          with:
            amount: "tools.amount"
            currency: "tools.currency"
            beneficiaryAccountNumber: "tools.beneficiaryAccountNumber"
            beneficiaryBankId: "tools.beneficiaryBankId"
            reference: "tools.reference"
          outputParameters:
            - type: object
              mapping: "$."
