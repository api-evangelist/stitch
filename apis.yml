aid: stitch
name: Stitch
description: Stitch is an open banking and payments API platform providing unified access to financial data and
  payment rails across banks and financial institutions in Africa, primarily South Africa and Nigeria. Stitch enables
  businesses to accept payments via multiple channels, access bank account data, and issue disbursements through
  a single GraphQL API.
